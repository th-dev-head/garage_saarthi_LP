# =========================================================================
# GarmageSaarthi Next.js Static Export Nginx Configuration Fix
# Path on Server: /etc/nginx/sites-available/your-site-config
# =========================================================================

server {
    listen 80;
    server_name garagesaarthi.com www.garagesaarthi.com;

    root /var/www/garage/garage-landing/dist; # Or your server dist path
    index index.html;

    # 1. Standard static files routing with trailingSlash support
    location / {
        # This will resolve folder-based index.html files and fallback to 404
        try_files $uri $uri/ $uri/index.html =404;
    }

    # 2. Map 404 errors to the custom 404.html generated by Next.js
    error_page 404 /404/index.html; # Or /404.html depending on how Nginx maps it

    location = /404/index.html {
        internal;
    }

    # Optional: Cache control for static assets (JS, CSS, Images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
